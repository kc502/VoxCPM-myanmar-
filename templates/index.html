<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxCPM TTS Demo & Voice Clone</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        textarea { width: 100%; height: 100px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 4px; }
        button:disabled { background: #ccc; }
        #audio-container { margin-top: 20px; }
    </style>
</head>
<body>
    <h2>VoxCPM TTS & Voice Clone Demo</h2>
    
    <div class="form-group">
        <label>၁။ စာသား ရိုက်ထည့်ပါ:</label>
        <textarea id="text-input" placeholder="ဒီမှာ စာသား ရိုက်ထည့်ပါ..."></textarea>
    </div>

    <div class="form-group">
        <label>၂။ Voice Cloning အတွက် အသံဖိုင် တင်ပါ (Optional):</label>
        <input type="file" id="audio-input" accept="audio/*">
    </div>

    <button id="generate-btn" onclick="generateTTS()">အသံထုတ်မည်</button>

    <div id="status" style="margin-top: 15px; font-weight: bold;"></div>
    <div id="audio-container"></div>

    <script>
        async function generateTTS() {
            const text = document.getElementById("text-input").value;
            const audioFile = document.getElementById("audio-input").files[0];
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("generate-btn");
            const audioContainer = document.getElementById("audio-container");

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ။");
                return;
            }

            statusDiv.innerText = "အသံ ပြောင်းနေပါသည်... ခဏစောင့်ပါ။";
            btn.disabled = true;
            audioContainer.innerHTML = "";

            // Form Data ပြင်ဆင်ခြင်း
            const formData = new FormData();
            formData.append("text", text);
            if (audioFile) {
                formData.append("reference_audio", audioFile);
            }

            try {
                const response = await fetch("/generate-audio", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    statusDiv.innerText = "ပြီးပါပြီ!";
                    // Browser တွင် အသံ တိုက်ရိုက်ဖွင့်နိုင်ရန် Cache မမိအောင် Timestamp ထည့်ထားသည်
                    const audioUrl = data.audio_url + "?t=" + new Date().getTime();
                    audioContainer.innerHTML = `<audio controls autoplay src="${audioUrl}"></audio>`;
                } else {
                    statusDiv.innerText = "အမှားအယွင်း ရှိပါသည်: " + data.error;
                }
            } catch (err) {
                statusDiv.innerText = "Server Error: " + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
