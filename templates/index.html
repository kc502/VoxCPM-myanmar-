<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VoxCPM Myanmar Voice</title>
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <!-- Mobile Card Container -->
    <div class="w-full max-w-md glass-card rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-indigo-600/20 rounded-2xl text-indigo-400 mb-2">
                <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-wide">VoxCPM Voice Studio</h1>
            <p class="text-xs text-slate-400">AI Text-to-Speech & Voice Cloning</p>
        </div>

        <!-- Form Area -->
        <div class="space-y-4">
            
            <!-- Text Input with 50,000 Char Limit -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                        <i class="fa-solid fa-pen-nib mr-1"></i> စာသား ရိုက်ထည့်ပါ
                    </label>
                    <span id="char-count" class="text-[10px] text-slate-400">0 / 50000</span>
                </div>
                <textarea id="text-input" rows="4" maxlength="50000" oninput="updateCharCount()"
                    class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition resize-none"
                    placeholder="ဒီမှာ ပြောချင်သော စာသားများ ရိုက်ထည့်ပါ..."></textarea>
            </div>

            <!-- Voice Cloning Options -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    <i class="fa-solid fa-microphone-lines mr-1"></i> VOICE CLONE (OPTIONAL)
                </label>
                
                <!-- Tab Controls -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900/60 rounded-xl border border-slate-800 text-xs font-medium">
                    <button id="tab-record-btn" onclick="switchTab('record')" class="py-2 rounded-lg bg-indigo-600 text-white transition">
                        <i class="fa-solid fa-microphone mr-1"></i> အသံဖမ်းမည်
                    </button>
                    <button id="tab-upload-btn" onclick="switchTab('upload')" class="py-2 rounded-lg text-slate-400 transition hover:text-white">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> File တင်မည်
                    </button>
                </div>

                <!-- Record Section -->
                <div id="section-record" class="mt-3 p-4 bg-slate-900/40 border border-slate-800 rounded-2xl text-center space-y-3">
                    <div id="record-status" class="text-xs text-slate-400">မိုက်ခရိုဖုန်းနှိပ်၍ အသံဖမ်းပါ</div>
                    
                    <div class="flex items-center justify-center gap-3">
                        <button id="mic-btn" onclick="handleMicClick()" 
                            class="w-12 h-12 rounded-full bg-rose-600 text-white flex items-center justify-center text-lg shadow-lg hover:bg-rose-500 active:scale-95 transition">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>

                    <!-- Recorded Audio Preview -->
                    <div id="record-player-area" class="hidden space-y-2 pt-2 border-t border-slate-800">
                        <div class="text-[11px] text-slate-400">ဖမ်းထားသော အသံ Preview:</div>
                        <audio id="recorded-preview" controls class="w-full h-8 rounded-lg"></audio>
                        <button onclick="clearRecordedAudio()" class="text-xs text-rose-400 hover:text-rose-300 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ဖျက်ထုတ်မည်
                        </button>
                    </div>
                </div>

                <!-- Upload Section -->
                <div id="section-upload" class="hidden mt-3 p-4 bg-slate-900/40 border border-slate-800 rounded-2xl text-center space-y-3">
                    <input type="file" id="audio-file-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                    
                    <div id="upload-select-area">
                        <label for="audio-file-input" class="cursor-pointer block space-y-2">
                            <i class="fa-solid fa-file-audio text-2xl text-slate-400"></i>
                            <div class="text-xs text-slate-400">Audio File (.wav, .mp3, .m4a) ရွေးချယ်ပါ</div>
                        </label>
                    </div>

                    <!-- Uploaded Audio Preview -->
                    <div id="upload-file-info" class="hidden space-y-2 border-t border-slate-800 pt-2">
                        <div id="file-label" class="text-xs text-indigo-400 font-medium"></div>
                        <audio id="uploaded-preview" controls class="w-full h-8 rounded-lg"></audio>
                        <button onclick="clearUploadedFile()" class="text-xs text-rose-400 hover:text-rose-300 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ဖျက်ထုတ်မည်
                        </button>
                    </div>
                </div>

            </div>

            <!-- Generate Button -->
            <button id="generate-btn" onclick="generateSpeech()" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-[0.98] text-white font-semibold rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
                <span>အသံထုတ်လုပ်မည်</span>
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

        <!-- Status & Result Player Area -->
        <div id="result-area" class="space-y-3 pt-2">
            <div id="status-text" class="text-xs text-center font-medium text-slate-400"></div>
            <div id="timer-text" class="text-[11px] text-center font-mono text-indigo-400 hidden"></div>
            
            <div id="audio-container" class="w-full space-y-3"></div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let activeTab = 'record';
        let isRecording = false;
        let isCountingDown = false;
        let timerInterval = null;

        // Character Count Update
        function updateCharCount() {
            const text = document.getElementById('text-input').value;
            document.getElementById('char-count').innerText = `${text.length} / 50000`;
        }

        // Tab Switcher
        function switchTab(tab) {
            activeTab = tab;
            const recBtn = document.getElementById('tab-record-btn');
            const upBtn = document.getElementById('tab-upload-btn');
            const recSec = document.getElementById('section-record');
            const upSec = document.getElementById('section-upload');

            if(tab === 'record') {
                recBtn.className = 'py-2 rounded-lg bg-indigo-600 text-white transition';
                upBtn.className = 'py-2 rounded-lg text-slate-400 transition hover:text-white';
                recSec.classList.remove('hidden');
                upSec.classList.add('hidden');
            } else {
                upBtn.className = 'py-2 rounded-lg bg-indigo-600 text-white transition';
                recBtn.className = 'py-2 rounded-lg text-slate-400 transition hover:text-white';
                upSec.classList.remove('hidden');
                recSec.classList.add('hidden');
            }
        }

        // --- RECORD LOGIC WITH HIGH QUALITY AUDIO & COUNTDOWN ---
        async function handleMicClick() {
            if (isCountingDown) return;

            if (isRecording) {
                stopRecording();
            } else {
                startCountdown();
            }
        }

        function startCountdown() {
            isCountingDown = true;
            const status = document.getElementById('record-status');
            const micBtn = document.getElementById('mic-btn');
            let count = 3;

            micBtn.className = "w-12 h-12 rounded-full bg-slate-700 text-white flex items-center justify-center text-lg font-bold";
            micBtn.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    micBtn.innerText = count;
                } else {
                    clearInterval(timer);
                    isCountingDown = false;
                    micBtn.innerText = "";
                    startRecording();
                }
            }, 1000);
        }

        async function startRecording() {
            const micBtn = document.getElementById('mic-btn');
            const status = document.getElementById('record-status');
            const playerArea = document.getElementById('record-player-area');

            try {
                // High Quality & Clear Audio Constraints (ဆူညံသံဖျောက်ပြီး အသံကျယ်ကျယ်ကြည်ကြည်ရစေရန်)
                const audioConstraints = {
                    audio: {
                        echoCancellation: true,    // စက်ယောင်သံများ ဖျောက်ရန်
                        noiseSuppression: true,    // ဘေးပတ်ဝန်းကျင် ဆူညံသံ ဖျောက်ရန်
                        autoGainControl: true,     // အသံတိုးပါက အလိုအလျောက် ကျယ်ပေးရန်
                        sampleRate: 44100,          // High Quality Studio Sample Rate
                        channelCount: 1            // Voice Clone အတွက် Mono Audio
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(audioConstraints);
                
                // High Bitrate သတ်မှတ်ခြင်း (128kbps)
                const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 128000 };
                
                try {
                    mediaRecorder = new MediaRecorder(stream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const preview = document.getElementById('recorded-preview');
                    preview.src = URL.createObjectURL(recordedAudioBlob);
                    playerArea.classList.remove('hidden');
                    status.innerText = "အသံဖမ်းယူပြီးပါပြီ!";
                    status.className = "text-xs text-emerald-400";
                };

                mediaRecorder.start();
                isRecording = true;

                micBtn.className = "w-12 h-12 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg shadow-lg animate-pulse";
                micBtn.innerHTML = `<i class="fa-solid fa-stop"></i>`;
                status.innerText = "အသံဖမ်းနေပါသည်...";
                status.className = "text-xs text-amber-400";

            } catch (err) {
                alert("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် မရရှိပါ သို့မဟုတ် မိုက်ခရိုဖုန်း မရှိပါ။");
                isRecording = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            micBtn.className = "w-12 h-12 rounded-full bg-rose-600 text-white flex items-center justify-center text-lg shadow-lg hover:bg-rose-500 active:scale-95 transition";
            micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
        }

        function clearRecordedAudio() {
            recordedAudioBlob = null;
            document.getElementById('recorded-preview').src = "";
            document.getElementById('record-player-area').classList.add('hidden');
            const status = document.getElementById('record-status');
            status.innerText = "မိုက်ခရိုဖုန်းနှိပ်၍ အသံဖမ်းပါ";
            status.className = "text-xs text-slate-400";
        }

        // --- UPLOAD LOGIC WITH PREVIEW ---
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('upload-select-area').classList.add('hidden');
                document.getElementById('upload-file-info').classList.remove('hidden');
                document.getElementById('file-label').innerText = `ရွေးထားသောဖိုင်: ${file.name}`;
                
                // Preview Uploaded Audio
                const uploadedPreview = document.getElementById('uploaded-preview');
                uploadedPreview.src = URL.createObjectURL(file);
            }
        }

        function clearUploadedFile() {
            const input = document.getElementById('audio-file-input');
            input.value = "";
            document.getElementById('uploaded-preview').src = "";
            document.getElementById('upload-select-area').classList.remove('hidden');
            document.getElementById('upload-file-info').classList.add('hidden');
        }

        // --- SUBMIT & TIMER LOGIC ---
        async function generateSpeech() {
            const text = document.getElementById('text-input').value;
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');
            const btn = document.getElementById('generate-btn');
            const audioContainer = document.getElementById('audio-container');

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!");
                return;
            }

            const formData = new FormData();
            formData.append("text", text);

            if (activeTab === 'record' && recordedAudioBlob) {
                formData.append("reference_audio", recordedAudioBlob, "recorded_voice.webm");
            } else if (activeTab === 'upload') {
                const fileInput = document.getElementById('audio-file-input');
                if (fileInput.files[0]) {
                    formData.append("reference_audio", fileInput.files[0]);
                }
            }

            statusText.innerText = "အသံ ထုတ်လုပ်နေပါသည်... ခဏစောင့်ပါ။";
            statusText.className = "text-xs text-center font-medium text-amber-400 animate-pulse";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            // Timer Start
            let seconds = 0;
            timerText.classList.remove('hidden');
            timerText.innerText = `ကြာမြင့်ချိန်: 0 စက္ကန့်`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                if (mins > 0) {
                    timerText.innerText = `ကြာမြင့်ချိန်: ${mins} မိနစ် ${secs} စက္ကန့်`;
                } else {
                    timerText.innerText = `ကြာမြင့်ချိန်: ${secs} စက္ကန့်`;
                }
            }, 1000);

            try {
                const response = await fetch("/generate-audio", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                clearInterval(timerInterval);

                if (data.success) {
                    statusText.innerText = "အသံထုတ်ယူခြင်း အောင်မြင်ပါသည်။";
                    statusText.className = "text-xs text-center font-medium text-emerald-400";
                    
                    const audioUrl = data.audio_url + "?t=" + new Date().getTime();
                    
                    // No Autoplay & Add Download Button
                    audioContainer.innerHTML = `
                        <div class="p-4 bg-slate-900/80 border border-slate-700/80 rounded-2xl space-y-3">
                            <audio controls class="w-full h-10 rounded-xl">
                                <source src="${audioUrl}" type="audio/wav">
                            </audio>
                            <a href="${data.audio_url}" download="voxcpm_audio.wav" 
                                class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-download"></i>
                                <span>အသံဖိုင် ဒေါင်းလုဒ်ဆွဲမည် (.WAV)</span>
                            </a>
                        </div>
                    `;
                } else {
                    statusText.innerText = "အမှားအယွင်း ရှိပါသည်: " + data.error;
                    statusText.className = "text-xs text-center font-medium text-rose-400";
                }
            } catch (err) {
                clearInterval(timerInterval);
                statusText.innerText = "Server ချိတ်ဆက်မှု မအောင်မြင်ပါ: " + err.message;
                statusText.className = "text-xs text-center font-medium text-rose-400";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
