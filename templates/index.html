<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Voice Studio </title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    borderRadius: {
                        '3xl': '28px',
                        '2xl': '20px',
                    },
                    boxShadow: {
                        'glass': '0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 15px 0 rgba(59, 130, 246, 0.05)',
                        'button': '0 10px 25px -5px rgba(37, 99, 235, 0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fafafa;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Background Gradient Accents (Apple / Stripe style) */
        .bg-gradient-glow {
            background: radial-gradient(circle at 50% 0%, rgba(219, 234, 254, 0.7) 0%, rgba(250, 250, 250, 0) 70%);
        }

        /* Glassmorphism Card Style */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body class="bg-gradient-glow min-h-screen flex flex-col justify-between p-4 sm:p-6 md:p-10">

    <!-- Top Navigation Bar -->
    <header class="w-full max-w-xl mx-auto flex items-center justify-between mb-6 px-2">
        <div class="flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                <i class="fa-solid fa-sparkles text-sm"></i>
            </div>
            <div>
                <span class="font-bold text-base tracking-tight text-slate-900 block leading-none">Myanmar Voice Studio</span>
                <span class="text-[11px] font-medium text-slate-400 tracking-wide uppercase">Enterprise Voice AI</span>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-600 border border-emerald-200/60">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Live API
            </span>
        </div>
    </header>

    <!-- Main Container Card -->
    <main class="w-full max-w-xl mx-auto glass-panel rounded-3xl p-6 sm:p-8 shadow-glass space-y-6">
        
        <!-- Section Header -->
        <div class="space-y-1">
            <h1 class="text-xl font-bold tracking-tight text-slate-900">Speech & Voice Synthesis</h1>
            <p class="text-xs text-slate-500 font-normal">Generate natural Myanmar voice clones instantly using VoxCPM API.</p>
        </div>

        <!-- Form Area -->
        <div class="space-y-5">
            
            <!-- Text Input Area -->
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-600 flex items-center gap-1.5">
                        <i class="fa-regular fa-pen-to-square text-brand-500"></i>
                        <span>Input Script</span>
                    </label>
                    <span id="char-count" class="text-[11px] font-mono text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md">0 / 500</span>
                </div>
                <textarea id="text-input" rows="4" maxlength="500" oninput="updateCharCount()"
                    class="w-full bg-slate-50/50 border border-slate-200 rounded-2xl p-4 text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition-all duration-200 resize-none font-sans"
                    placeholder="ဒီမှာ ပြောချင်သော စာသားများ ရိုက်ထည့်ပါ..."></placeholder>
            </div>

            <!-- Voice Clone Options Container -->
            <div class="space-y-3 pt-1">
                <label class="text-xs font-semibold uppercase tracking-wider text-slate-600 flex items-center gap-1.5 px-1">
                    <i class="fa-regular fa-microphone-lines text-brand-500"></i>
                    <span>Voice Cloning (Optional)</span>
                </label>
                
                <!-- Modern Segmented Tab Controls (Linear/Stripe Style) -->
                <div class="grid grid-cols-2 gap-1.5 p-1.5 bg-slate-100/80 rounded-2xl border border-slate-200/60 text-xs font-medium">
                    <button id="tab-record-btn" onclick="switchTab('record')" 
                        class="py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-microphone text-brand-500"></i>
                        <span>Direct Record</span>
                    </button>
                    <button id="tab-upload-btn" onclick="switchTab('upload')" 
                        class="py-2.5 rounded-xl text-slate-500 hover:text-slate-900 font-medium transition-all duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-arrow-up-from-line"></i>
                        <span>Upload File</span>
                    </button>
                </div>

                <!-- Record Panel -->
                <div id="section-record" class="p-5 bg-slate-50/60 border border-slate-200/80 rounded-2xl text-center space-y-4">
                    <div id="record-status" class="text-xs font-medium text-slate-500">မိုက်ခရိုဖုန်းခလုတ်ကို နှိပ်၍ အသံဖမ်းပါ</div>
                    
                    <div class="flex items-center justify-center">
                        <button id="mic-btn" onclick="handleMicClick()" 
                            class="w-14 h-14 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center text-xl shadow-lg shadow-rose-500/25 hover:scale-105 active:scale-95 transition-all duration-200">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>

                    <!-- Recorded Audio Preview -->
                    <div id="record-player-area" class="hidden space-y-3 pt-3 border-t border-slate-200/60">
                        <div class="text-[11px] font-medium text-slate-500">Recorded Audio Preview</div>
                        <audio id="recorded-preview" controls class="w-full h-9 rounded-xl"></audio>
                        <button onclick="clearRecordedAudio()" class="text-xs font-medium text-rose-500 hover:text-rose-600 transition flex items-center justify-center gap-1 mx-auto">
                            <i class="fa-regular fa-trash-can"></i>
                            <span>ဖျက်ထုတ်မည်</span>
                        </button>
                    </div>
                </div>

                <!-- Upload Panel -->
                <div id="section-upload" class="hidden p-5 bg-slate-50/60 border border-slate-200/80 rounded-2xl text-center">
                    <input type="file" id="audio-file-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                    
                    <div id="upload-select-area">
                        <label for="audio-file-input" class="cursor-pointer group flex flex-col items-center justify-center space-y-2 py-2">
                            <div class="w-10 h-10 rounded-2xl bg-white border border-slate-200/80 text-slate-400 group-hover:text-brand-500 group-hover:border-brand-200 flex items-center justify-center transition-all duration-200">
                                <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                            </div>
                            <div class="text-xs font-medium text-slate-600 group-hover:text-brand-600 transition">Audio File (.wav, .mp3, .m4a) ရွေးချယ်ပါ</div>
                        </label>
                    </div>

                    <!-- Uploaded Audio Preview -->
                    <div id="upload-file-info" class="hidden space-y-3 pt-2">
                        <div id="file-label" class="text-xs font-semibold text-brand-600 truncate"></div>
                        <audio id="uploaded-preview" controls class="w-full h-9 rounded-xl"></audio>
                        <button onclick="clearUploadedFile()" class="text-xs font-medium text-rose-500 hover:text-rose-600 transition flex items-center justify-center gap-1 mx-auto">
                            <i class="fa-regular fa-trash-can"></i>
                            <span>ဖျက်ထုတ်မည်</span>
                        </button>
                    </div>
                </div>

            </div>

            <!-- Main CTA Generate Button (Full-width rounded Stripe Style) -->
            <button id="generate-btn" onclick="generateSpeech()" 
                class="w-full py-4 px-6 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-button transition-all duration-200 flex items-center justify-center gap-2 text-sm tracking-wide">
                <span>Generate Audio Synthesis</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>

        <!-- Status & Result Player Area -->
        <div id="result-area" class="space-y-3 pt-2">
            <div id="status-text" class="text-xs text-center font-medium text-slate-500"></div>
            <div id="timer-text" class="text-[11px] text-center font-mono text-brand-600 font-medium hidden"></div>
            
            <div id="audio-container" class="w-full space-y-3"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-xl mx-auto text-center py-4 text-xs text-slate-400 font-medium">
        Powered by VoxCPM AI • Deployed on Render Services
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let activeTab = 'record';
        let isRecording = false;
        let isCountingDown = false;
        let timerInterval = null;
        let audioContext = null;

        function updateCharCount() {
            const text = document.getElementById('text-input').value;
            document.getElementById('char-count').innerText = `${text.length} / 500`;
        }

        function switchTab(tab) {
            activeTab = tab;
            const recBtn = document.getElementById('tab-record-btn');
            const upBtn = document.getElementById('tab-upload-btn');
            const recSec = document.getElementById('section-record');
            const upSec = document.getElementById('section-upload');

            if(tab === 'record') {
                recBtn.className = 'py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2';
                upBtn.className = 'py-2.5 rounded-xl text-slate-500 hover:text-slate-900 font-medium transition-all duration-200 flex items-center justify-center gap-2';
                recSec.classList.remove('hidden');
                upSec.classList.add('hidden');
            } else {
                upBtn.className = 'py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2';
                recBtn.className = 'py-2.5 rounded-xl text-slate-500 hover:text-slate-900 font-medium transition-all duration-200 flex items-center justify-center gap-2';
                upSec.classList.remove('hidden');
                recSec.classList.add('hidden');
            }
        }

        // --- RECORD LOGIC WITH VOLUME BOOST (300%) & COUNTDOWN ---
        async function handleMicClick() {
            if (isCountingDown) return;
            if (isRecording) {
                stopRecording();
            } else {
                startCountdown();
            }
        }

        function startCountdown() {
            isCountingDown = true;
            const status = document.getElementById('record-status');
            const micBtn = document.getElementById('mic-btn');
            let count = 3;

            micBtn.className = "w-14 h-14 rounded-full bg-slate-800 text-white flex items-center justify-center text-xl font-bold shadow-lg";
            micBtn.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    micBtn.innerText = count;
                } else {
                    clearInterval(timer);
                    isCountingDown = false;
                    micBtn.innerText = "";
                    startRecording();
                }
            }, 1000);
        }

        async function startRecording() {
            const micBtn = document.getElementById('mic-btn');
            const status = document.getElementById('record-status');
            const playerArea = document.getElementById('record-player-area');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 44100
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const gainNode = audioContext.createGain();

                // Gain Boost 3x
                gainNode.gain.value = 3.0; 

                const destination = audioContext.createMediaStreamDestination();
                source.connect(gainNode);
                gainNode.connect(destination);

                const boostedStream = destination.stream;
                const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 128000 };
                
                try {
                    mediaRecorder = new MediaRecorder(boostedStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(boostedStream);
                }

                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const preview = document.getElementById('recorded-preview');
                    preview.src = URL.createObjectURL(recordedAudioBlob);
                    playerArea.classList.remove('hidden');
                    status.innerText = "အသံဖမ်းယူပြီးပါပြီ!";
                    status.className = "text-xs font-semibold text-emerald-600";
                    
                    if (audioContext) audioContext.close();
                };

                mediaRecorder.start();
                isRecording = true;

                micBtn.className = "w-14 h-14 rounded-full bg-amber-500 text-white flex items-center justify-center text-xl shadow-lg shadow-amber-500/30 animate-pulse";
                micBtn.innerHTML = `<i class="fa-solid fa-stop"></i>`;
                status.innerText = "အသံဖမ်းနေပါသည်...";
                status.className = "text-xs font-semibold text-amber-600";

            } catch (err) {
                alert("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် မရရှိပါ သို့မဟုတ် မိုက်ခရိုဖုန်း မရှိပါ။");
                isRecording = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            micBtn.className = "w-14 h-14 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center text-xl shadow-lg shadow-rose-500/25 hover:scale-105 active:scale-95 transition-all duration-200";
            micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
        }

        function clearRecordedAudio() {
            recordedAudioBlob = null;
            document.getElementById('recorded-preview').src = "";
            document.getElementById('record-player-area').classList.add('hidden');
            const status = document.getElementById('record-status');
            status.innerText = "မိုက်ခရိုဖုန်းခလုတ်ကို နှိပ်၍ အသံဖမ်းပါ";
            status.className = "text-xs font-medium text-slate-500";
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('upload-select-area').classList.add('hidden');
                document.getElementById('upload-file-info').classList.remove('hidden');
                document.getElementById('file-label').innerText = `Selected File: ${file.name}`;
                
                const uploadedPreview = document.getElementById('uploaded-preview');
                uploadedPreview.src = URL.createObjectURL(file);
            }
        }

        function clearUploadedFile() {
            const input = document.getElementById('audio-file-input');
            input.value = "";
            document.getElementById('uploaded-preview').src = "";
            document.getElementById('upload-select-area').classList.remove('hidden');
            document.getElementById('upload-file-info').classList.add('hidden');
        }

        // --- SUBMIT & TIMER LOGIC ---
        async function generateSpeech() {
            const text = document.getElementById('text-input').value;
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');
            const btn = document.getElementById('generate-btn');
            const audioContainer = document.getElementById('audio-container');

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!");
                return;
            }

            const formData = new FormData();
            formData.append("text", text);

            if (activeTab === 'record' && recordedAudioBlob) {
                formData.append("reference_audio", recordedAudioBlob, "recorded_voice.webm");
            } else if (activeTab === 'upload') {
                const fileInput = document.getElementById('audio-file-input');
                if (fileInput.files[0]) {
                    formData.append("reference_audio", fileInput.files[0]);
                }
            }

            statusText.innerText = "အသံ ထုတ်လုပ်နေပါသည်... ခဏစောင့်ပါ။";
            statusText.className = "text-xs text-center font-semibold text-brand-600 animate-pulse";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            let seconds = 0;
            timerText.classList.remove('hidden');
            timerText.innerText = `Processing: 0s`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerText.innerText = mins > 0 ? `Processing Time: ${mins}m ${secs}s` : `Processing Time: ${secs}s`;
            }, 1000);

            try {
                const response = await fetch("/generate-audio", {
                    method: "POST",
                    body: formData
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error("Server တုံ့ပြန်မှု မရရှိပါ။ စာသား အနည်းငယ် တိုပေးပြီး ပြန်စမ်းကြည့်ပါ။");
                }

                clearInterval(timerInterval);

                if (data.success) {
                    statusText.innerText = "Synthesis Completed Successfully";
                    statusText.className = "text-xs text-center font-semibold text-emerald-600";
                    
                    const audioUrl = data.audio_url + "?t=" + new Date().getTime();
                    
                    audioContainer.innerHTML = `
                        <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3 shadow-sm">
                            <audio controls class="w-full h-10 rounded-xl">
                                <source src="${audioUrl}" type="audio/wav">
                            </audio>
                            <a href="${data.audio_url}" download="voxcpm_audio.wav" 
                                class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-solid fa-download"></i>
                                <span>Download WAV Audio File</span>
                            </a>
                        </div>
                    `;
                } else {
                    statusText.innerText = "Error: " + data.error;
                    statusText.className = "text-xs text-center font-semibold text-rose-500";
                }
            } catch (err) {
                clearInterval(timerInterval);
                statusText.innerText = err.message;
                statusText.className = "text-xs text-center font-semibold text-rose-500";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
