<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Voice Studio </title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS, FontAwesome & WaveSurfer.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', -apple-system, 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    borderRadius: {
                        '3xl': '28px',
                        '2xl': '20px',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fafafa;
            background-image: radial-gradient(circle at 50% 0%, rgba(219, 234, 254, 0.6) 0%, rgba(250, 250, 250, 0) 70%);
            min-height: 100vh;
            color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 15px 0 rgba(59, 130, 246, 0.05);
        }
        canvas {
            display: block;
            width: 100%;
            height: 48px;
        }

        /* ပုံပါအတိုင်း အတိအကျဖြစ်စေမည့် Vibrant Blue Pill Button Style */
        .btn-vibrant-blue {
            background-color: #2563eb;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
        }
        .btn-vibrant-blue:hover {
            background-color: #1d4ed8;
            box-shadow: 0 12px 28px -5px rgba(29, 78, 216, 0.5);
        }
        .btn-vibrant-blue:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <!-- Mobile Card Container -->
    <div class="w-full max-w-md glass-card rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-brand-50 rounded-2xl text-brand-600 mb-2 border border-brand-100">
                <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Myanmar Voice Studio</h1>
            <p class="text-xs text-slate-500 font-medium">AI Text-to-Speech & Voice Cloning</p>
        </div>

        <!-- Form Area -->
        <div class="space-y-4">
            
            <!-- Text Input Area -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        <i class="fa-solid fa-pen-nib mr-1 text-brand-500"></i> စာသား ရိုက်ထည့်ပါ
                    </label>
                    <span id="char-count" class="text-[10px] text-slate-400 font-mono bg-slate-100 px-2 py-0.5 rounded-md">0 / 500</span>
                </div>
                <textarea id="text-input" rows="4" maxlength="500" oninput="updateCharCount()"
                    class="w-full bg-slate-50/50 border border-slate-200 rounded-2xl p-3.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-200 resize-none"
                    placeholder="ဒီမှာ ပြောချင်သော စာသားများ ရိုက်ထည့်ပါ..."></textarea>
            </div>

            <!-- Voice Cloning Actions -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    <i class="fa-solid fa-microphone-lines mr-1 text-brand-500"></i> VOICE CLONE (OPTIONAL)
                </label>
                
                <!-- Action Buttons Pair -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100/80 rounded-2xl border border-slate-200/60 text-xs font-medium">
                    <!-- Record Action Button -->
                    <button id="rec-action-btn" onclick="handleMicClick()" 
                        class="py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition hover:bg-slate-50 flex items-center justify-center gap-2">
                        <i id="rec-icon" class="fa-solid fa-microphone text-brand-500"></i>
                        <span id="rec-btn-text">အသံဖမ်းမည်</span>
                    </button>

                    <!-- Upload Action Button -->
                    <label for="audio-file-input" 
                        class="py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition hover:bg-slate-50 flex items-center justify-center gap-2 cursor-pointer">
                        <i class="fa-solid fa-cloud-arrow-up text-brand-500"></i>
                        <span id="upload-btn-text">File တင်မည်</span>
                    </label>
                    <input type="file" id="audio-file-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                </div>

                <!-- Live Voice Recording Canvas Visualizer -->
                <div id="live-visualizer-card" class="hidden mt-3 p-3 bg-slate-900 rounded-2xl space-y-2 border border-slate-800">
                    <div class="flex justify-between items-center px-1">
                        <span id="live-rec-status" class="text-[11px] font-medium text-amber-400 animate-pulse">
                            <i class="fa-solid fa-circle text-[8px] mr-1"></i> အသံဖမ်းနေပါသည်...
                        </span>
                        <span id="rec-timer" class="text-[11px] font-mono text-slate-400">0s</span>
                    </div>
                    <canvas id="live-wave-canvas" class="w-full h-12 rounded-lg bg-slate-950/60"></canvas>
                </div>

                <!-- Voice Clone Audio Waveform Preview Area -->
                <div id="clone-preview-card" class="hidden mt-3 p-3 bg-slate-50/80 border border-slate-200/80 rounded-2xl space-y-2">
                    <div class="flex justify-between items-center text-xs text-slate-600 px-1 font-medium">
                        <span id="clone-file-name" class="truncate max-w-[200px]"><i class="fa-solid fa-waveform mr-1 text-brand-500"></i> Reference Audio</span>
                        <button onclick="clearCloneAudio()" class="text-rose-500 hover:text-rose-600 transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ရှင်းထုတ်မည်
                        </button>
                    </div>
                    
                    <!-- Hugging Face Style Waveform Player -->
                    <div class="flex items-center gap-3 bg-white p-2.5 rounded-xl border border-slate-200/60">
                        <button id="clone-play-btn" onclick="toggleWavePlay(cloneWaveSurfer, 'clone-play-btn')" 
                            class="w-9 h-9 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0 shadow-sm hover:bg-brand-700 transition">
                            <i class="fa-solid fa-play text-xs"></i>
                        </button>
                        <div id="clone-waveform" class="w-full"></div>
                    </div>
                </div>

            </div>

            <!-- Generate Button (ပုံပါအတိုင်း အတိအကျ ပြင်ဆင်ထားသော Button) -->
            <button id="generate-btn" onclick="generateSpeech()" 
                class="w-full py-4 px-6 btn-vibrant-blue text-white font-semibold rounded-full transition-all duration-200 flex items-center justify-center gap-2.5 text-base tracking-wide">
                <span>အသံထုတ်လုပ်မည်</span>
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

        <!-- Output Result Waveform Area -->
        <div id="result-area" class="space-y-3 pt-2">
            <div id="status-text" class="text-xs text-center font-medium text-slate-500"></div>
            <div id="timer-text" class="text-[11px] text-center font-mono text-brand-600 font-medium hidden"></div>
            
            <div id="output-preview-card" class="hidden p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3 shadow-sm">
                <div class="text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-check text-emerald-500"></i>
                    <span>Generated Audio Output</span>
                </div>
                
                <!-- Hugging Face Style Output Waveform -->
                <div class="flex items-center gap-3 bg-white p-3 rounded-xl border border-slate-200/60">
                    <button id="output-play-btn" onclick="toggleWavePlay(outputWaveSurfer, 'output-play-btn')" 
                        class="w-10 h-10 rounded-full bg-brand-600 text-white flex items-center justify-center shrink-0 shadow-sm hover:bg-brand-700 transition">
                        <i class="fa-solid fa-play text-sm"></i>
                    </button>
                    <div id="output-waveform" class="w-full"></div>
                </div>

                <a id="download-link" href="#" download="voxcpm_audio.wav" 
                    class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                    <i class="fa-solid fa-download"></i>
                    <span>အသံဖိုင် ဒေါင်းလုဒ်ဆွဲမည် (.WAV)</span>
                </a>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        let mediaRecorder;
        let audioStream = null;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let selectedFile = null;
        let isRecording = false;
        let isCountingDown = false;
        let timerInterval = null;
        let recTimerInterval = null;

        let audioContext = null;
        let analyserNode = null;
        let animationFrameId = null;

        let cloneWaveSurfer = null;
        let outputWaveSurfer = null;

        document.addEventListener("DOMContentLoaded", () => {
            initWaveSurfers();
        });

        function initWaveSurfers() {
            cloneWaveSurfer = WaveSurfer.create({
                container: '#clone-waveform',
                waveColor: '#cbd5e1',
                progressColor: '#2563eb',
                height: 36,
                barWidth: 2,
                barGap: 2,
                barRadius: 2,
                cursorWidth: 0
            });

            cloneWaveSurfer.on('finish', () => {
                document.getElementById('clone-play-btn').innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
            });

            outputWaveSurfer = WaveSurfer.create({
                container: '#output-waveform',
                waveColor: '#cbd5e1',
                progressColor: '#059669',
                height: 42,
                barWidth: 3,
                barGap: 2,
                barRadius: 3,
                cursorWidth: 0
            });

            outputWaveSurfer.on('finish', () => {
                document.getElementById('output-play-btn').innerHTML = `<i class="fa-solid fa-play text-sm"></i>`;
            });
        }

        function toggleWavePlay(wsInstance, btnId) {
            if (!wsInstance) return;
            const btn = document.getElementById(btnId);
            if (wsInstance.isPlaying()) {
                wsInstance.pause();
                btn.innerHTML = `<i class="fa-solid fa-play text-xs"></i>`;
            } else {
                wsInstance.play();
                btn.innerHTML = `<i class="fa-solid fa-pause text-xs"></i>`;
            }
        }

        function updateCharCount() {
            const text = document.getElementById('text-input').value;
            document.getElementById('char-count').innerText = `${text.length} / 500`;
        }

        async function handleMicClick() {
            if (isCountingDown) return;
            if (isRecording) {
                stopRecording();
            } else {
                startCountdown();
            }
        }

        function startCountdown() {
            isCountingDown = true;
            const recBtn = document.getElementById('rec-action-btn');
            const btnText = document.getElementById('rec-btn-text');
            const icon = document.getElementById('rec-icon');
            let count = 3;

            icon.className = "fa-solid fa-spinner animate-spin text-amber-500";
            btnText.innerText = `${count}s...`;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    btnText.innerText = `${count}s...`;
                } else {
                    clearInterval(timer);
                    isCountingDown = false;
                    startRecording();
                }
            }, 1000);
        }

        async function startRecording() {
            const recBtn = document.getElementById('rec-action-btn');
            const btnText = document.getElementById('rec-btn-text');
            const icon = document.getElementById('rec-icon');
            const liveVis = document.getElementById('live-visualizer-card');

            try {
                audioStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 44100
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(audioStream);

                const gainNode = audioContext.createGain();
                gainNode.gain.value = 1.5;

                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 64;

                source.connect(gainNode);
                gainNode.connect(analyserNode);

                const destination = audioContext.createMediaStreamDestination();
                gainNode.connect(destination);

                const boostedStream = destination.stream;
                const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 128000 };
                
                try {
                    mediaRecorder = new MediaRecorder(boostedStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(boostedStream);
                }

                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    
                    if (audioStream) {
                        audioStream.getTracks().forEach(track => track.stop());
                        audioStream = null;
                    }

                    if (audioContext) {
                        audioContext.close();
                        audioContext = null;
                    }

                    cancelAnimationFrame(animationFrameId);
                    liveVis.classList.add('hidden');

                    const audioUrl = URL.createObjectURL(recordedAudioBlob);
                    document.getElementById('clone-file-name').innerHTML = `<i class="fa-solid fa-microphone mr-1 text-brand-500"></i> ဖမ်းထားသော အသံ (Recorded Voice)`;
                    document.getElementById('clone-preview-card').classList.remove('hidden');
                    cloneWaveSurfer.load(audioUrl);
                };

                mediaRecorder.start();
                isRecording = true;

                icon.className = "fa-solid fa-square text-rose-500 animate-pulse";
                btnText.innerText = "ရပ်မည်";
                liveVis.classList.remove('hidden');

                let recSecs = 0;
                document.getElementById('rec-timer').innerText = `0s`;
                clearInterval(recTimerInterval);
                recTimerInterval = setInterval(() => {
                    recSecs++;
                    document.getElementById('rec-timer').innerText = `${recSecs}s`;
                }, 1000);

                drawLiveWaveform();

            } catch (err) {
                alert("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် မရရှိပါ သို့မဟုတ် မိုက်ခရိုဖုန်း မရှိပါ။");
                isRecording = false;
                resetRecButtonUI();
            }
        }

        function drawLiveWaveform() {
            const canvas = document.getElementById('live-wave-canvas');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function renderFrame() {
                animationFrameId = requestAnimationFrame(renderFrame);
                analyserNode.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2;
                let barHeight;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    barHeight = (dataArray[i] / 255) * canvas.height;

                    ctx.fillStyle = '#3b82f6';
                    ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

                    x += barWidth;
                }
            }
            renderFrame();
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            clearInterval(recTimerInterval);
            isRecording = false;
            resetRecButtonUI();
        }

        function resetRecButtonUI() {
            const btnText = document.getElementById('rec-btn-text');
            const icon = document.getElementById('rec-icon');
            icon.className = "fa-solid fa-microphone text-brand-500";
            btnText.innerText = "အသံဖမ်းမည်";
        }

        function clearCloneAudio() {
            recordedAudioBlob = null;
            selectedFile = null;
            document.getElementById('audio-file-input').value = "";
            document.getElementById('clone-preview-card').classList.add('hidden');
            if (cloneWaveSurfer) cloneWaveSurfer.empty();
        }

        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                selectedFile = file;
                recordedAudioBlob = null;

                document.getElementById('clone-file-name').innerHTML = `<i class="fa-solid fa-file-audio mr-1 text-brand-500"></i> ${file.name}`;
                document.getElementById('clone-preview-card').classList.remove('hidden');

                const fileUrl = URL.createObjectURL(file);
                cloneWaveSurfer.load(fileUrl);
            }
        }

        async function generateSpeech() {
            const text = document.getElementById('text-input').value;
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');
            const btn = document.getElementById('generate-btn');
            const outputCard = document.getElementById('output-preview-card');

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!");
                return;
            }

            const formData = new FormData();
            formData.append("text", text);

            if (recordedAudioBlob) {
                formData.append("reference_audio", recordedAudioBlob, "recorded_voice.webm");
            } else if (selectedFile) {
                formData.append("reference_audio", selectedFile);
            }

            statusText.innerText = "အသံ ထုတ်လုပ်နေပါသည်... ခဏစောင့်ပါ။";
            statusText.className = "text-xs text-center font-semibold text-brand-600 animate-pulse";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            let seconds = 0;
            timerText.classList.remove('hidden');
            timerText.innerText = `Processing: 0s`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerText.innerText = mins > 0 ? `Processing Time: ${mins}m ${secs}s` : `Processing Time: ${secs}s`;
            }, 1000);

            try {
                const response = await fetch("/generate-audio", {
                    method: "POST",
                    body: formData
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error("Server တုံ့ပြန်မှု မရရှိပါ။ စာသား အနည်းငယ် တိုပေးပြီး ပြန်စမ်းကြည့်ပါ။");
                }

                clearInterval(timerInterval);

                if (data.success) {
                    statusText.innerText = "အသံထုတ်ယူခြင်း အောင်မြင်ပါသည်။";
                    statusText.className = "text-xs text-center font-semibold text-emerald-600";
                    
                    const audioUrl = data.audio_url + "?t=" + new Date().getTime();
                    
                    outputCard.classList.remove('hidden');
                    outputWaveSurfer.load(audioUrl);

                    const downloadLink = document.getElementById('download-link');
                    downloadLink.href = data.audio_url;

                } else {
                    statusText.innerText = "Error: " + data.error;
                    statusText.className = "text-xs text-center font-semibold text-rose-500";
                }
            } catch (err) {
                clearInterval(timerInterval);
                statusText.innerText = err.message;
                statusText.className = "text-xs text-center font-semibold text-rose-500";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
