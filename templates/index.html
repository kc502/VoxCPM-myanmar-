<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Myanmar Voice Studio </title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS & FontAwesome Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    borderRadius: {
                        '3xl': '28px',
                        '2xl': '20px',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #fafafa;
            background-image: radial-gradient(circle at 50% 0%, rgba(219, 234, 254, 0.6) 0%, rgba(250, 250, 250, 0) 70%);
            min-height: 100vh;
            color: #0f172a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), 0 0 15px 0 rgba(59, 130, 246, 0.05);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6">

    <!-- Mobile Card Container -->
    <div class="w-full max-w-md glass-card rounded-3xl p-6 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-1">
            <div class="inline-flex p-3 bg-brand-50 rounded-2xl text-brand-600 mb-2 border border-brand-100">
                <i class="fa-solid fa-wand-magic-sparkles text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Myanmar Voice Studio</h1>
            <p class="text-xs text-slate-500 font-medium">AI Text-to-Speech & Voice Cloning</p>
        </div>

        <!-- Form Area -->
        <div class="space-y-4">
            
            <!-- Text Input with 500 Char Limit -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-semibold text-slate-700 uppercase tracking-wider">
                        <i class="fa-solid fa-pen-nib mr-1 text-brand-500"></i> စာသား ရိုက်ထည့်ပါ
                    </label>
                    <span id="char-count" class="text-[10px] text-slate-400 font-mono bg-slate-100 px-2 py-0.5 rounded-md">0 / 500</span>
                </div>
                <textarea id="text-input" rows="4" maxlength="500" oninput="updateCharCount()"
                    class="w-full bg-slate-50/50 border border-slate-200 rounded-2xl p-3.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-200 resize-none"
                    placeholder="ဒီမှာ ပြောချင်သော စာသားများ ရိုက်ထည့်ပါ..."></textarea>
            </div>

            <!-- Voice Cloning Options -->
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">
                    <i class="fa-solid fa-microphone-lines mr-1 text-brand-500"></i> VOICE CLONE (OPTIONAL)
                </label>
                
                <!-- Tab Controls -->
                <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100/80 rounded-2xl border border-slate-200/60 text-xs font-medium">
                    <button id="tab-record-btn" onclick="switchTab('record')" class="py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition">
                        <i class="fa-solid fa-microphone mr-1 text-brand-500"></i> အသံဖမ်းမည်
                    </button>
                    <button id="tab-upload-btn" onclick="switchTab('upload')" class="py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> File တင်မည်
                    </button>
                </div>

                <!-- Record Section -->
                <div id="section-record" class="mt-3 p-4 bg-slate-50/60 border border-slate-200/80 rounded-2xl text-center space-y-3">
                    <div id="record-status" class="text-xs text-slate-500 font-medium">မိုက်ခရိုဖုန်းနှိပ်၍ အသံဖမ်းပါ</div>
                    
                    <div class="flex items-center justify-center gap-3">
                        <button id="mic-btn" onclick="handleMicClick()" 
                            class="w-12 h-12 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center text-lg shadow-md shadow-rose-500/20 hover:scale-105 active:scale-95 transition">
                            <i class="fa-solid fa-microphone"></i>
                        </button>
                    </div>

                    <!-- Recorded Audio Preview -->
                    <div id="record-player-area" class="hidden space-y-2 pt-2 border-t border-slate-200">
                        <div class="text-[11px] text-slate-500">ဖမ်းထားသော အသံ Preview:</div>
                        <audio id="recorded-preview" controls class="w-full h-8 rounded-lg"></audio>
                        <button onclick="clearRecordedAudio()" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ဖျက်ထုတ်မည်
                        </button>
                    </div>
                </div>

                <!-- Upload Section -->
                <div id="section-upload" class="hidden mt-3 p-4 bg-slate-50/60 border border-slate-200/80 rounded-2xl text-center space-y-3">
                    <input type="file" id="audio-file-input" accept="audio/*" class="hidden" onchange="handleFileSelect(event)">
                    
                    <div id="upload-select-area">
                        <label for="audio-file-input" class="cursor-pointer block space-y-2">
                            <i class="fa-solid fa-file-audio text-2xl text-slate-400"></i>
                            <div class="text-xs text-slate-500 font-medium">Audio File (.wav, .mp3, .m4a) ရွေးချယ်ပါ</div>
                        </label>
                    </div>

                    <!-- Uploaded Audio Preview -->
                    <div id="upload-file-info" class="hidden space-y-2 border-t border-slate-200 pt-2">
                        <div id="file-label" class="text-xs text-brand-600 font-semibold truncate"></div>
                        <audio id="uploaded-preview" controls class="w-full h-8 rounded-lg"></audio>
                        <button onclick="clearUploadedFile()" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition">
                            <i class="fa-solid fa-trash-can mr-1"></i> ဖျက်ထုတ်မည်
                        </button>
                    </div>
                </div>

            </div>

            <!-- Generate Button -->
            <button id="generate-btn" onclick="generateSpeech()" 
                class="w-full py-3.5 px-4 bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-700 hover:to-brand-600 active:scale-[0.98] text-white font-semibold rounded-2xl shadow-lg shadow-brand-500/25 transition flex items-center justify-center gap-2">
                <span>အသံထုတ်လုပ်မည်</span>
                <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
        </div>

        <!-- Status & Result Player Area -->
        <div id="result-area" class="space-y-3 pt-2">
            <div id="status-text" class="text-xs text-center font-medium text-slate-500"></div>
            <div id="timer-text" class="text-[11px] text-center font-mono text-brand-600 font-medium hidden"></div>
            
            <div id="audio-container" class="w-full space-y-3"></div>
        </div>

    </div>

    <!-- JavaScript Logic (ယခင်မူလ Code အဟောင်းအတိုင်း လုံးဝ မပြောင်းလဲပါ) -->
    <script>
        let mediaRecorder;
        let audioChunks = [];
        let recordedAudioBlob = null;
        let activeTab = 'record';
        let isRecording = false;
        let isCountingDown = false;
        let timerInterval = null;
        let audioContext = null;

        // Character Count Update
        function updateCharCount() {
            const text = document.getElementById('text-input').value;
            document.getElementById('char-count').innerText = `${text.length} / 500`;
        }

        // Tab Switcher
        function switchTab(tab) {
            activeTab = tab;
            const recBtn = document.getElementById('tab-record-btn');
            const upBtn = document.getElementById('tab-upload-btn');
            const recSec = document.getElementById('section-record');
            const upSec = document.getElementById('section-upload');

            if(tab === 'record') {
                recBtn.className = 'py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition';
                upBtn.className = 'py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition';
                recSec.classList.remove('hidden');
                upSec.classList.add('hidden');
            } else {
                upBtn.className = 'py-2.5 rounded-xl bg-white text-slate-900 shadow-sm font-semibold transition';
                recBtn.className = 'py-2.5 rounded-xl text-slate-500 hover:text-slate-900 transition';
                upSec.classList.remove('hidden');
                recSec.classList.add('hidden');
            }
        }

        // --- RECORD LOGIC WITH VOLUME BOOST (300%) & COUNTDOWN ---
        async function handleMicClick() {
            if (isCountingDown) return;

            if (isRecording) {
                stopRecording();
            } else {
                startCountdown();
            }
        }

        function startCountdown() {
            isCountingDown = true;
            const status = document.getElementById('record-status');
            const micBtn = document.getElementById('mic-btn');
            let count = 3;

            micBtn.className = "w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center text-lg font-bold shadow-md";
            micBtn.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    micBtn.innerText = count;
                } else {
                    clearInterval(timer);
                    isCountingDown = false;
                    micBtn.innerText = "";
                    startRecording();
                }
            }, 1000);
        }

        async function startRecording() {
            const micBtn = document.getElementById('mic-btn');
            const status = document.getElementById('record-status');
            const playerArea = document.getElementById('record-player-area');

            try {
                // ၁။ မိုက်ခရိုဖုန်း အသံဖမ်းယူမှု အပြင်အဆင်
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 44100
                    }
                });

                // ၂။ Web Audio API ဖြင့် Volume 300% (၃ ဆ) Boost လုပ်ခြင်း
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                const gainNode = audioContext.createGain();

                // အသံပမာဏကို ၃ ဆ အလိုအလျောက် မြှင့်ပေးမည်
                gainNode.gain.value = 3.0; 

                const destination = audioContext.createMediaStreamDestination();
                source.connect(gainNode);
                gainNode.connect(destination);

                const boostedStream = destination.stream;

                const options = { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 128000 };
                try {
                    mediaRecorder = new MediaRecorder(boostedStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(boostedStream);
                }

                audioChunks = [];

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const preview = document.getElementById('recorded-preview');
                    preview.src = URL.createObjectURL(recordedAudioBlob);
                    playerArea.classList.remove('hidden');
                    status.innerText = "အသံဖမ်းယူပြီးပါပြီ!";
                    status.className = "text-xs font-semibold text-emerald-600";
                    
                    if (audioContext) {
                        audioContext.close();
                    }
                };

                mediaRecorder.start();
                isRecording = true;

                micBtn.className = "w-12 h-12 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg shadow-lg shadow-amber-500/30 animate-pulse";
                micBtn.innerHTML = `<i class="fa-solid fa-stop"></i>`;
                status.innerText = "အသံဖမ်းနေပါသည်...";
                status.className = "text-xs font-semibold text-amber-600";

            } catch (err) {
                alert("မိုက်ခရိုဖုန်း ခွင့်ပြုချက် မရရှိပါ သို့မဟုတ် မိုက်ခရိုဖုန်း မရှိပါ။");
                isRecording = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            isRecording = false;
            const micBtn = document.getElementById('mic-btn');
            micBtn.className = "w-12 h-12 rounded-full bg-gradient-to-tr from-rose-500 to-pink-500 text-white flex items-center justify-center text-lg shadow-md shadow-rose-500/20 hover:scale-105 active:scale-95 transition";
            micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i>`;
        }

        function clearRecordedAudio() {
            recordedAudioBlob = null;
            document.getElementById('recorded-preview').src = "";
            document.getElementById('record-player-area').classList.add('hidden');
            const status = document.getElementById('record-status');
            status.innerText = "မိုက်ခရိုဖုန်းနှိပ်၍ အသံဖမ်းပါ";
            status.className = "text-xs text-slate-500";
        }

        // --- UPLOAD LOGIC WITH PREVIEW ---
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('upload-select-area').classList.add('hidden');
                document.getElementById('upload-file-info').classList.remove('hidden');
                document.getElementById('file-label').innerText = `ရွေးထားသောဖိုင်: ${file.name}`;
                
                const uploadedPreview = document.getElementById('uploaded-preview');
                uploadedPreview.src = URL.createObjectURL(file);
            }
        }

        function clearUploadedFile() {
            const input = document.getElementById('audio-file-input');
            input.value = "";
            document.getElementById('uploaded-preview').src = "";
            document.getElementById('upload-select-area').classList.remove('hidden');
            document.getElementById('upload-file-info').classList.add('hidden');
        }

        // --- SUBMIT & TIMER LOGIC ---
        async function generateSpeech() {
            const text = document.getElementById('text-input').value;
            const statusText = document.getElementById('status-text');
            const timerText = document.getElementById('timer-text');
            const btn = document.getElementById('generate-btn');
            const audioContainer = document.getElementById('audio-container');

            if (!text) {
                alert("ကျေးဇူးပြု၍ စာသား ရိုက်ထည့်ပါ!");
                return;
            }

            const formData = new FormData();
            formData.append("text", text);

            if (activeTab === 'record' && recordedAudioBlob) {
                formData.append("reference_audio", recordedAudioBlob, "recorded_voice.webm");
            } else if (activeTab === 'upload') {
                const fileInput = document.getElementById('audio-file-input');
                if (fileInput.files[0]) {
                    formData.append("reference_audio", fileInput.files[0]);
                }
            }

            statusText.innerText = "အသံ ထုတ်လုပ်နေပါသည်... ခဏစောင့်ပါ။";
            statusText.className = "text-xs text-center font-semibold text-brand-600 animate-pulse";
            btn.disabled = true;
            btn.classList.add('opacity-50');

            // Timer Start
            let seconds = 0;
            timerText.classList.remove('hidden');
            timerText.innerText = `ကြာမြင့်ချိန်: 0 စက္ကန့်`;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                seconds++;
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                timerText.innerText = mins > 0 ? `ကြာမြင့်ချိန်: ${mins} မိနစ် ${secs} စက္ကန့်` : `ကြာမြင့်ချိန်: ${secs} စက္ကန့်`;
            }, 1000);

            try {
                const response = await fetch("/generate-audio", {
                    method: "POST",
                    body: formData
                });

                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    throw new Error("Server တုံ့ပြန်မှု မရရှိပါ။ စာသား အနည်းငယ် တိုပေးပြီး ပြန်စမ်းကြည့်ပါ။");
                }

                clearInterval(timerInterval);

                if (data.success) {
                    statusText.innerText = "အသံထုတ်ယူခြင်း အောင်မြင်ပါသည်။";
                    statusText.className = "text-xs text-center font-semibold text-emerald-600";
                    
                    const audioUrl = data.audio_url + "?t=" + new Date().getTime();
                    
                    audioContainer.innerHTML = `
                        <div class="p-4 bg-slate-50 border border-slate-200/80 rounded-2xl space-y-3 shadow-sm">
                            <audio controls class="w-full h-10 rounded-xl">
                                <source src="${audioUrl}" type="audio/wav">
                            </audio>
                            <a href="${data.audio_url}" download="voxcpm_audio.wav" 
                                class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                                <i class="fa-solid fa-download"></i>
                                <span>အသံဖိုင် ဒေါင်းလုဒ်ဆွဲမည် (.WAV)</span>
                            </a>
                        </div>
                    `;
                } else {
                    statusText.innerText = "အမှားအယွင်း ရှိပါသည်: " + data.error;
                    statusText.className = "text-xs text-center font-semibold text-rose-500";
                }
            } catch (err) {
                clearInterval(timerInterval);
                statusText.innerText = err.message;
                statusText.className = "text-xs text-center font-semibold text-rose-500";
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>
</html>
